<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Invoice — KONÏG</title>
<link rel="icon" href="/favicon.ico">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#e9eaee;font-family:Helvetica,Arial,sans-serif;color:#333;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px;background:#16161d}
  .bar button,.bar a{background:#7B2FBE;color:#fff;border:none;padding:10px 16px;font-size:14px;font-weight:700;border-radius:4px;text-decoration:none;cursor:pointer}
  .bar .wa{background:#25D366}
  .wrap{padding:16px 8px 40px}
  .page{width:210mm;min-height:297mm;margin:0 auto;background:#fff;padding:16mm 13mm;box-shadow:0 2px 12px rgba(0,0,0,.15);position:relative}
  .top{display:flex;justify-content:space-between;align-items:flex-start}
  .logo{width:56mm;margin-top:4mm}
  .meta h1{margin:0 0 6mm;text-align:right;color:#3a6ea5;font-size:26px}
  .meta table{border-collapse:collapse;font-size:13px}
  .meta td{padding:1px 0}
  .meta td:first-child{text-align:right;padding-right:22mm}
  .meta td:last-child{text-align:right}
  .parties{display:flex;gap:18mm;margin-top:14mm}
  .parties>div{flex:1}
  .ph{font-weight:700;font-size:13px;padding-bottom:3mm;border-bottom:2px solid #8a8f9c;margin-bottom:6mm}
  .pname{color:#3a8bc0;font-weight:700;font-size:13px;margin-bottom:5mm}
  .pinfo{font-size:13px;line-height:1.5}
  table.items{width:100%;border-collapse:separate;border-spacing:2px 0;margin-top:14mm;font-size:13px}
  table.items th{background:#2d3a4b;color:#fff;text-align:center;padding:10px 6px;font-weight:700}
  table.items th:first-child,table.items th:nth-child(2){text-align:left;padding-left:10px}
  table.items td{background:#f0f0f0;padding:10px 6px;text-align:center;color:#555;border-bottom:2px solid #fff}
  table.items td:first-child,table.items td:nth-child(2){text-align:left;padding-left:10px}
  table.items td:last-child{text-align:right;padding-right:10px}
  .bottom{display:flex;justify-content:space-between;margin-top:10mm;gap:8mm}
  .left{width:46%;padding-top:24mm;font-size:13px}
  .left .ph{margin-top:8mm}
  .left .txt{line-height:1.45;white-space:pre-line}
  .sum{width:50%;font-size:13px}
  .sum .r{display:flex;justify-content:space-between;padding:3px 0}
  .sum .r span:first-child{flex:1;text-align:right;padding-right:6mm;font-weight:700;color:#555}
  .sum .r span:last-child{min-width:38mm;text-align:right;color:#555}
  .dphead{font-weight:700;color:#555;text-align:center;padding:6px 0 4px}
  .dptbl{width:100%;border-collapse:collapse;font-size:13px}
  .dptbl th{background:#c9e0f0;font-weight:400;color:#555;padding:6px;text-align:left}
  .dptbl th:first-child{text-align:right}
  .dptbl td{padding:8px 6px;color:#555}
  .dptbl td:first-child{text-align:right}
  .dptbl td:last-child{text-align:right;font-weight:700;color:#333}
  .tag{border-top:1px solid #333;margin-top:4px;padding-top:6px}
  .tag .r span{font-weight:700 !important;color:#333 !important}
  .datefoot{text-align:center;font-weight:700;color:#555;margin-top:8mm;font-size:13px}
  .lunas{position:absolute;right:28mm;top:232mm;border:3px solid #16a34a;color:#16a34a;font-weight:800;font-size:28px;letter-spacing:4px;padding:6px 18px;transform:rotate(-12deg);opacity:.85}
  .msg{text-align:center;padding:60px 20px;font-size:15px;color:#555}
  @page{size:A4;margin:0}
  @media print{
    body{background:#fff}
    .bar{display:none !important}
    .wrap{padding:0;overflow:visible}
    .page{box-shadow:none;margin:0;width:210mm;min-height:0;height:296mm;overflow:hidden;zoom:1 !important}
  }
</style>
</head>
<body>
<div class="bar" id="bar" style="display:none">
  <button onclick="window.print()">Download PDF / Print</button>
  <a class="wa" id="waBtn" href="#" target="_blank">Kirim via WhatsApp</a>
</div>
<div class="wrap"><div id="root" class="msg">Memuat invoice...</div></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const app = initializeApp({
  apiKey: "AIzaSyApef7fcfnPPjRN15L58n3D87AGnQ30_es",
  authDomain: "konig-auto-detailing.firebaseapp.com",
  projectId: "konig-auto-detailing",
  storageBucket: "konig-auto-detailing.firebasestorage.app",
  messagingSenderId: "235399414542",
  appId: "1:235399414542:web:bd9a2f3ed88f4ea36bcd5f"
});
const db = getFirestore(app);
const root = document.getElementById('root');
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => Number(n||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const dmy = s => { if(!s) return '-'; const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; };
const longDate = s => { if(!s) return ''; const d = new Date(s + 'T00:00:00'); return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}); };
const titleCase = t => String(t||'').toLowerCase().replace(/(^|[\s\-'])(\S)/g, (m,a,b) => a + b.toUpperCase());
const waNum = raw => { let n = String(raw||'').replace(/[^0-9]/g,''); if(n.startsWith('0')) n = '62' + n.slice(1); else if(n.startsWith('8')) n = '62' + n; return n; };

const code = new URLSearchParams(location.search).get('code');
(async () => {
  if (!code) { root.textContent = 'Kode invoice tidak ditemukan.'; return; }
  let snap;
  try { snap = await getDoc(doc(db, 'konig_progress', code)); }
  catch(e) { root.textContent = 'Gagal memuat invoice: ' + e.message; return; }
  if (!snap.exists() || !snap.data().invoice) { root.textContent = 'Invoice belum tersedia.'; return; }
  const j = snap.data(), inv = j.invoice;
  const nama = j.custName ? ((j.custTitle ? j.custTitle + ' ' : '') + titleCase(j.custName)) : '-';
  document.title = 'Invoice ' + inv.no + ' — KONÏG';
  const rows = (inv.items||[]).map(it => `<tr><td>${esc(it.produk)}</td><td>${esc(it.desc)}</td><td>${it.qty}</td><td>${money(it.harga)}</td><td>${it.disc ? money(it.disc) : 0}</td><td>-</td><td>${money(it.qty*it.harga - (it.disc||0))}</td></tr>`).join('');
  const dp = inv.pay === 'dp' && inv.dp && inv.dp.amount ? `
      <div class="dphead">Down Payment</div>
      <table class="dptbl"><tr><th>No. Down Payment</th><th>Tgl. Jatuh Tempo</th><th></th></tr>
      <tr><td>${esc(inv.dp.no || '-')}</td><td>${esc(inv.dp.date || '')}</td><td>Rp (${money(inv.dp.amount)})</td></tr></table>` : '';
  root.className = '';
  root.innerHTML = `<div class="page">
    ${inv.pay === 'lunas' ? '<div class="lunas">LUNAS</div>' : ''}
    <div class="top">
      <img class="logo" src="/konig-logo.png" alt="KONÏG">
      <div class="meta"><h1>Invoice</h1><table>
        <tr><td>Referensi</td><td>${esc(inv.no)}</td></tr>
        <tr><td>Tanggal</td><td>${dmy(inv.date)}</td></tr>
        <tr><td>Tgl. Jatuh Tempo</td><td>${dmy(inv.due)}</td></tr></table></div>
    </div>
    <div class="parties">
      <div><div class="ph">Info Perusahaan</div><div class="pname">KONÏG MOBIL INDONESIA</div>
        <div class="pinfo">Ruko Downtown Drive DBLV 27,<br>Kab. Tangerang,<br>Banten,<br>Telp: 62881080578712<br>Email: konigmobilindonesia@gmail.com</div></div>
      <div><div class="ph">Tagihan Untuk</div><div class="pname">${esc(nama)}</div>
        <div class="pinfo">Telp: ${esc(waNum(j.wa) || '-')}</div></div>
    </div>
    <table class="items"><colgroup><col style="width:21%"><col style="width:19%"><col style="width:6%"><col style="width:15%"><col style="width:13%"><col style="width:8%"><col style="width:18%"></colgroup><tr><th>Produk</th><th>Deskripsi</th><th>Qty</th><th>Harga</th><th>Disc</th><th>Pajak</th><th>Jumlah</th></tr>${rows}</table>
    <div class="bottom">
      <div class="left">
        <div class="ph">Keterangan</div><div class="txt">${esc(inv.keterangan || '')}</div>
        <div class="ph">Syarat &amp; Ketentuan</div>
        <div class="txt">Pembayaran Ke:
BCA
PT KONIG MOBIL INDONESIA
7615866016</div>
      </div>
      <div class="sum">
        <div class="r"><span>Subtotal</span><span>Rp ${money(inv.subtotal)}</span></div>
        <div class="r"><span>Diskon Tambahan</span><span>Rp (${money(inv.diskon)})</span></div>
        <div class="r"><span>Pajak</span><span>Rp 0.00</span></div>
        <div class="r"><span>Total</span><span>Rp ${money(inv.total)}</span></div>
        <div class="r"><span>Pajak Inclusive</span><span>Rp 0.00</span></div>
        ${dp}
        <div class="tag"><div class="r"><span>${inv.pay === 'lunas' ? 'Status' : 'Jumlah Tertagih:'}</span><span>${inv.pay === 'lunas' ? 'LUNAS' : 'Rp ' + money(inv.tertagih)}</span></div></div>
        <div class="datefoot">${longDate(inv.date)}</div>
      </div>
    </div>
  </div>`;
  const msg = 'Halo ' + nama + ',\n\nBerikut invoice ' + inv.no + ' untuk ' + (j.car || 'kendaraan Anda') + (j.plate ? ' (' + j.plate + ')' : '') + ':\n' + location.href + '\n\n'
    + (inv.pay === 'lunas' ? 'Status: Lunas. Terima kasih.' : 'Jumlah tertagih: Rp ' + Number(inv.tertagih||0).toLocaleString('id-ID') + '\nPembayaran ke BCA 7615866016 a.n. PT KONIG MOBIL INDONESIA.')
    + '\n\nSalam,\nKONIG Auto Detailing';
  document.getElementById('waBtn').href = 'https://wa.me/' + waNum(j.wa) + '?text=' + encodeURIComponent(msg);
  const fit = () => { const pg = document.querySelector('.page'); if (!pg) return; const w = document.querySelector('.wrap').clientWidth - 16; pg.style.zoom = w < 794 ? (w / 794).toFixed(3) : ''; };
  fit(); addEventListener('resize', fit);
  addEventListener('beforeprint', () => { const pg = document.querySelector('.page'); if (pg) pg.style.zoom = ''; });
  addEventListener('afterprint', fit);
  if (localStorage.getItem('konig_admin')) document.getElementById('bar').style.display = 'flex';
  else { document.getElementById('bar').style.display = 'flex'; document.getElementById('waBtn').style.display = 'none'; }
})();
</script>
</body>
</html>
