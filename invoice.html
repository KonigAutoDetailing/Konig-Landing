<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Invoice — KONÏG</title>
<link rel="icon" href="/favicon.ico">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#e9eaee;font-family:Helvetica,Arial,sans-serif;color:#333;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px;background:#16161d}
  .bar button:disabled{opacity:.6}
  .bar button,.bar a{background:#7B2FBE;color:#fff;border:none;padding:10px 16px;font-size:14px;font-weight:700;border-radius:4px;text-decoration:none;cursor:pointer}
  .bar .wa{background:#25D366}
  .wrap{padding:16px 8px 40px}
  .page{width:210mm;height:297mm;overflow:hidden;margin:0 auto;background:#fff;padding:16mm 13mm;box-shadow:0 2px 12px rgba(0,0,0,.15);position:relative}
  .top{display:flex;justify-content:space-between;align-items:flex-start}
  .logo{width:56mm;margin-top:4mm}
  .meta h1{margin:0 0 6mm;text-align:right;color:#3a6ea5;font-size:26px}
  .meta table{border-collapse:collapse;font-size:13px}
  .meta td{padding:1px 0}
  .meta td:first-child{text-align:right;padding-right:22mm}
  .meta td:last-child{text-align:right}
  .parties{display:flex;gap:18mm;margin-top:14mm}
  .parties>div{flex:1}
  .ph{font-weight:700;font-size:13px;padding-bottom:3mm;border-bottom:2px solid #8a8f9c;margin-bottom:6mm}
  .pname{color:#3a8bc0;font-weight:700;font-size:13px;margin-bottom:5mm}
  .pinfo{font-size:13px;line-height:1.5}
  table.items{width:100%;border-collapse:separate;border-spacing:2px 0;margin-top:14mm;font-size:13px}
  table.items th{background:#2d3a4b;color:#fff;text-align:center;padding:10px 6px;font-weight:700}
  table.items th:first-child,table.items th:nth-child(2){text-align:left;padding-left:10px}
  table.items td{background:#f0f0f0;padding:10px 6px;text-align:center;color:#555;border-bottom:2px solid #fff}
  table.items td:first-child,table.items td:nth-child(2){text-align:left;padding-left:10px}
  table.items td:last-child{text-align:right;padding-right:10px}
  table.items td:nth-child(2){font-size:11.5px;line-height:1.45}
  .bottom{display:flex;justify-content:space-between;margin-top:10mm;gap:8mm}
  .left{width:46%;padding-top:24mm;font-size:13px}
  .left .ph{margin-top:8mm}
  .left .txt{line-height:1.45;white-space:pre-line}
  .sum{width:50%;font-size:13px}
  .sum .r{display:flex;justify-content:space-between;padding:3px 0}
  .sum .r span:first-child{flex:1;text-align:right;padding-right:6mm;font-weight:700;color:#555}
  .sum .r span:last-child{min-width:38mm;text-align:right;color:#555}
  .dphead{font-weight:700;color:#555;text-align:center;padding:6px 0 4px}
  .dptbl{width:100%;border-collapse:collapse;font-size:13px}
  .dptbl th{background:#c9e0f0;font-weight:400;color:#555;padding:6px;text-align:left}
  .dptbl th:first-child{text-align:right}
  .dptbl td{padding:8px 6px;color:#555}
  .dptbl td:first-child{text-align:right}
  .dptbl td:last-child{text-align:right;font-weight:700;color:#333}
  .tag{border-top:1px solid #333;margin-top:4px;padding-top:6px}
  .tag .r span{font-weight:700 !important;color:#333 !important}
  .st{width:100%;border-collapse:collapse;font-size:13px;color:#555}
  .st td{padding:5px 0}
  .st td:first-child{font-weight:700;padding-right:6mm}
  .st td:last-child{text-align:right;white-space:nowrap}
  .st small{display:block;font-weight:400;font-size:11px;color:#888;margin-top:1px}
  .st tr.tot td{border-top:1px solid #bbb;padding-top:8px;color:#333}
  .st tr.sec td{padding-top:14px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#3a6ea5;border-bottom:1px solid #c9e0f0}
  .st tr.pay td{padding:7px 0}
  .st tr.pay td:last-child{color:#333}
  .st tr.due td{border-top:2px solid #2d3a4b;padding-top:10px;font-size:15px;font-weight:800;color:#2d3a4b}
  .ket{border-collapse:collapse;font-size:13px}
  .ket td{padding:2px 0}
  .ket td:first-child{color:#777;padding-right:8mm}
  .datefoot{text-align:center;font-weight:700;color:#555;margin-top:8mm;font-size:13px}
  .lunas{position:absolute;right:24mm;bottom:14mm;z-index:2;border:3px solid #16a34a;color:#16a34a;font-weight:800;font-size:28px;letter-spacing:4px;padding:6px 18px;transform:rotate(-12deg);opacity:.85}
  .msg{text-align:center;padding:60px 20px;font-size:15px;color:#555}
  @page{size:A4;margin:0}
  @media print{
    body{background:#fff}
    .bar{display:none !important}
    .wrap{padding:0;overflow:visible}
    .page{box-shadow:none;margin:0;width:210mm;min-height:0;height:296mm;overflow:hidden;zoom:1 !important}
  }
</style>
</head>
<body>
<div class="bar" id="bar" style="display:none">
  <button id="dlBtn" onclick="downloadPdf()">Download PDF</button>
  <a class="wa" id="waBtn" href="#" target="_blank" style="display:none">Kirim via WhatsApp</a>
</div>
<div class="wrap"><div id="root" class="msg">Memuat invoice...</div></div>

<script src="/inv-desc.js?v=1"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const app = initializeApp({
  apiKey: "AIzaSyApef7fcfnPPjRN15L58n3D87AGnQ30_es",
  authDomain: "konig-auto-detailing.firebaseapp.com",
  projectId: "konig-auto-detailing",
  storageBucket: "konig-auto-detailing.firebasestorage.app",
  messagingSenderId: "235399414542",
  appId: "1:235399414542:web:bd9a2f3ed88f4ea36bcd5f"
});
const db = getFirestore(app);
const root = document.getElementById('root');
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => Number(n||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const dmy = s => { if(!s) return '-'; const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; };
const longDate = s => { if(!s) return ''; const d = new Date(s + 'T00:00:00'); return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}); };
const titleCase = t => String(t||'').toLowerCase().replace(/(^|[\s\-'])(\S)/g, (m,a,b) => a + b.toUpperCase());
const waNum = raw => { let n = String(raw||'').replace(/[^0-9]/g,''); if(n.startsWith('0')) n = '62' + n.slice(1); else if(n.startsWith('8')) n = '62' + n; return n; };

const code = new URLSearchParams(location.search).get('code');
(async () => {
  if (!code) { root.textContent = 'Kode invoice tidak ditemukan.'; return; }
  let snap;
  try { snap = await getDoc(doc(db, 'konig_progress', code)); }
  catch(e) { root.textContent = 'Gagal memuat invoice: ' + e.message; return; }
  if (!snap.exists()) { root.textContent = 'Invoice belum tersedia.'; return; }
  const j0 = snap.data(), vIdx = new URLSearchParams(location.search).get('v');
  const j = vIdx !== null && j0.visits && j0.visits[+vIdx] ? { ...j0, ...j0.visits[+vIdx] } : j0;
  const inv = j.invoice;
  if (!inv) { root.textContent = 'Invoice belum tersedia.'; return; }
  const nama = j.custName ? ((j.custTitle ? j.custTitle + ' ' : '') + titleCase(j.custName)) : '-';
  document.title = 'Invoice ' + inv.no + ' — KONÏG';
  // Layanan standar selalu pakai deskripsi terbaru
  const curDesc = it => { const base = String(it.produk||'').replace(/ - (Small|Medium|Large|X-tra Large)$/,'').replace(/ - /g, ' — '); const m = window.KONIG_DESC_MAP || {}; return m[base] || it.desc || ''; };
  const rows = (inv.items||[]).map(it => `<tr><td>${esc(it.produk)}</td><td>${esc(curDesc(it))}</td><td>${it.qty}</td><td>${money(it.harga)}</td><td>${it.discPct ? it.discPct + '%' : (it.disc ? money(it.disc) : 0)}</td><td>${(it.qty*it.harga - (it.disc||0)) <= 0 && it.harga ? '<b style="color:#16a34a">FREE</b>' : money(it.qty*it.harga - (it.disc||0))}</td></tr>`).join('');
  const dmy2 = v => /^\d{4}-\d{2}-\d{2}$/.test(v||'') ? dmy(v) : esc(v||'');
  const hasDp = inv.dp && inv.dp.amount;
  const pel = inv.pay === 'lunas' ? (inv.pelunasan || { amount: Math.max(0, inv.total - (hasDp ? inv.dp.amount : 0)), date: inv.date }) : null;
  const autoKet = [j.car, j.color ? titleCase(j.color) : '', j.plate].filter(Boolean).join(' - ');
  const catatan = (inv.keterangan || '').trim() && inv.keterangan.trim() !== autoKet ? inv.keterangan.trim() : '';
  const payRows = (hasDp ? `<tr class="pay"><td>Down Payment<small>${esc(inv.dp.no || '')}${inv.dp.date ? ' · ' + dmy2(inv.dp.date) : ''}</small></td><td>- Rp ${money(inv.dp.amount)}</td></tr>` : '')
    + (pel ? `<tr class="pay"><td>Pelunasan<small>${pel.date ? dmy2(pel.date) : ''}</small></td><td>- Rp ${money(pel.amount)}</td></tr>` : '');
  root.className = '';
  root.innerHTML = `<div class="page">${inv.pay === 'lunas' ? '<div class="lunas">LUNAS</div>' : ''}<div class="pin">
    <div class="top">
      <img class="logo" src="/konig-logo.png" alt="KONÏG">
      <div class="meta"><h1>Invoice</h1><table>
        <tr><td>Referensi</td><td>${esc(inv.no)}</td></tr>
        <tr><td>Tanggal</td><td>${dmy(inv.date)}</td></tr>
        <tr><td>Tgl. Jatuh Tempo</td><td>${dmy(inv.due)}</td></tr></table></div>
    </div>
    <div class="parties">
      <div><div class="ph">Info Perusahaan</div><div class="pname">KONÏG MOBIL INDONESIA</div>
        <div class="pinfo">Ruko Downtown Drive DBLV 27,<br>Kab. Tangerang,<br>Banten,<br>Telp: 62881080578712<br>Email: konigmobilindonesia@gmail.com</div></div>
      <div><div class="ph">Tagihan Untuk</div><div class="pname">${esc(nama)}</div>
        <div class="pinfo">Telp: ${esc(waNum(j.wa) || '-')}</div></div>
    </div>
    <table class="items"><colgroup><col style="width:22%"><col style="width:33%"><col style="width:6%"><col style="width:14%"><col style="width:9%"><col style="width:16%"></colgroup><tr><th>Produk</th><th>Deskripsi</th><th>Qty</th><th>Harga</th><th>Disc</th><th>Jumlah</th></tr>${rows}</table>
    <div class="bottom">
      <div class="left">
        <div class="ph">Keterangan</div>
        <table class="ket"><tr><td>Tipe Mobil</td><td>${esc(j.car || '-')}</td></tr>
          <tr><td>Warna</td><td>${esc(j.color ? titleCase(j.color) : '-')}</td></tr>
          <tr><td>Plat Nomor</td><td>${esc(j.plate || '-')}</td></tr></table>
        ${catatan ? `<div class="txt" style="margin-top:6px">${esc(catatan)}</div>` : ''}
        <div class="ph">Rekening Pembayaran</div>
        <div class="txt">Transfer ke:
Bank BCA
No. Rekening: 7615866016
a.n. PT KONIG MOBIL INDONESIA</div>
      </div>
      <div class="sum">
        <table class="st">
          <tr><td>Subtotal</td><td>Rp ${money(inv.subtotal)}</td></tr>
          ${inv.diskon ? `<tr><td>Diskon Tambahan${inv.diskonPct ? ' (' + inv.diskonPct + '%)' : ''}</td><td>- Rp ${money(inv.diskon)}</td></tr>` : ''}
          <tr><td>Pajak</td><td>Rp 0.00</td></tr>
          <tr class="tot"><td>Total</td><td>Rp ${money(inv.total)}</td></tr>
          ${payRows ? `<tr class="sec"><td colspan="2">Pembayaran</td></tr>` + payRows : ''}
          <tr class="due"><td>Jumlah Tertagih</td><td>Rp ${money(inv.pay === 'lunas' ? 0 : inv.tertagih)}</td></tr>
        </table>
        <div class="datefoot">${longDate(inv.date)}</div>
      </div>
    </div>
  </div></div>`;
  const msg = 'Halo ' + nama + ',\n\nBerikut invoice ' + inv.no + ' untuk ' + (j.car || 'kendaraan Anda') + (j.plate ? ' (' + j.plate + ')' : '') + ':\n' + location.href + '\n\n'
    + (inv.pay === 'lunas' ? 'Status: Lunas. Terima kasih.' : 'Jumlah tertagih: Rp ' + Number(inv.tertagih||0).toLocaleString('id-ID') + '\nPembayaran ke BCA 7615866016 a.n. PT KONIG MOBIL INDONESIA.')
    + '\n\nSalam,\nKONIG Auto Detailing';
  // Selalu 1 halaman: kecilkan isi kalau melebihi tinggi A4
  (function(){ const pg = root.querySelector('.page'), pin = root.querySelector('.pin'); const avail = pg.clientHeight - parseFloat(getComputedStyle(pg).paddingTop) - parseFloat(getComputedStyle(pg).paddingBottom); const h = pin.scrollHeight; if (h > avail) pin.style.zoom = (avail / h).toFixed(3); })();
  window.__invNo = inv.no; window.__invMsg = msg;
  const fit = () => { const pg = document.querySelector('.page'); if (!pg) return; const w = document.querySelector('.wrap').clientWidth - 16; pg.style.zoom = w < 794 ? (w / 794).toFixed(3) : ''; };
  fit(); addEventListener('resize', fit);
  addEventListener('beforeprint', () => { const pg = document.querySelector('.page'); if (pg) pg.style.zoom = ''; });
  addEventListener('afterprint', fit);
  window.__invReady = true;
  if (new URLSearchParams(location.search).get('embed')) { document.getElementById('bar').style.display = 'none'; return; }
  document.getElementById('bar').style.display = 'flex';
  // Tombol kirim WA hanya untuk admin (HP workshop yang sudah login)
  if (new URLSearchParams(location.search).get('a') === '1' && localStorage.getItem('konig_admin')) { const wb = document.getElementById('waBtn'); wb.href = 'https://wa.me/' + waNum(j.wa) + '?text=' + encodeURIComponent(msg); wb.style.display = ''; }
})();
</script>

<script>
function loadScript(src){ return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); }); }
async function buildPdf(){
  if (!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  if (!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  const pg = document.querySelector('.page');
  const z = pg.style.zoom; pg.style.zoom = '';
  try {
    const canvas = await html2canvas(pg, { scale: 2, backgroundColor: '#ffffff', useCORS: true, windowWidth: 900 });
    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
    const h = Math.min(297, canvas.height * 210 / canvas.width);
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, h);
    return pdf.output('blob');
  } finally { pg.style.zoom = z; }
}
function pdfName(){ return 'Invoice ' + String(window.__invNo || 'KONIG').replace(/\//g, '-') + '.pdf'; }
async function withBusy(btn, fn){ const t = btn.textContent; btn.disabled = true; btn.textContent = 'Menyiapkan PDF...'; try { await fn(); } catch(e) { if (e && e.name !== 'AbortError') alert('Gagal membuat PDF: ' + e.message); } btn.disabled = false; btn.textContent = t; }
function saveBlob(blob){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = pdfName(); document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
window.downloadPdf = () => withBusy(document.getElementById('dlBtn'), async () => saveBlob(await buildPdf()));
window.sharePdf = () => withBusy(document.getElementById('waBtn'), async () => {
  const blob = await buildPdf();
  const file = new File([blob], pdfName(), { type: 'application/pdf' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: pdfName() });
  else { saveBlob(blob); alert('HP ini tidak mendukung kirim file langsung. PDF sudah di-download, silakan lampirkan manual di WhatsApp.'); }
});
window.buildPdf = buildPdf; window.pdfName = pdfName;
</script>
</body>
</html>
