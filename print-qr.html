<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>KONÏG — Print QR Sticker Stock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="/qr-template-b64.js?v=4"></script>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --black:#080810;--dark:#0f0f1a;--panel:#161625;--border:#2a2a45;
      --purple:#7B2FBE;--purpleB:#b06aff;--white:#f0eeff;--text:#d4cef0;--muted:#9d93c0;
    }
    body{background:var(--black);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;padding:24px}

    /* ── SCREEN UI ── */
    .screen-ui{max-width:600px;margin:0 auto}
    .logo{margin-bottom:4px}
    .logo img{height:36px;display:block}
    .subtitle{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:32px}
    h2{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--white);margin-bottom:20px}

    .controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:28px;align-items:flex-end}
    .ctrl-group{display:flex;flex-direction:column;gap:6px}
    .ctrl-group label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
    .ctrl-group input{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--white);font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;padding:10px 14px;width:120px;outline:none}
    .ctrl-group input:focus{border-color:var(--purple)}
    .btn{background:var(--purple);color:#fff;border:none;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:12px 24px;cursor:pointer;transition:background 0.2s}
    .btn:hover{background:var(--purpleB)}
    .btn-outline{background:transparent;border:1px solid var(--purple);color:var(--purpleB)}
    .btn-outline:hover{background:rgba(123,47,190,0.15)}
    .btn-print{background:#1a3a1a;border:1px solid #4cd4a0;color:#4cd4a0;min-width:160px}
    .btn-print:hover{background:#1f4a1f}
    .btn-print:disabled{opacity:0.5;cursor:not-allowed}

    /* ── PDF Progress Overlay ── */
    #pdfOverlay{display:none;position:fixed;inset:0;background:rgba(8,8,16,0.85);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:20px}
    #pdfOverlay.active{display:flex}
    .pdf-progress-box{background:#161625;border:1px solid #2a2a45;padding:32px 40px;text-align:center;min-width:320px}
    .pdf-progress-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:#f0eeff;margin-bottom:8px}
    .pdf-progress-sub{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px;color:#9d93c0;margin-bottom:20px}
    .pdf-progress-bar-bg{background:#0f0f1a;height:6px;width:100%;overflow:hidden}
    .pdf-progress-bar-fill{background:#7B2FBE;height:6px;width:0%;transition:width 0.3s ease}
    .pdf-progress-pct{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;color:#b06aff;margin-top:12px}

    .preview-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
    #previewGrid{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px}

    /* ── STICKER CARD (screen preview) ── */
    .sticker-wrap{width:160px;text-align:center}
    .sticker-preview{
      position:relative;width:160px;border-radius:6px;overflow:hidden;
      border:1px solid var(--border);display:block;
    }
    .sticker-preview canvas{width:160px;height:auto;display:block}
    .sticker-preview.used{opacity:0.45}
    .sticker-preview.used::after{content:'🔒 TERPAKAI';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(248,113,113,0.9);color:#fff;font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:2px;padding:4px 8px;white-space:nowrap}
    .btn-dl{display:block;width:100%;margin-top:6px;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:4px;cursor:pointer;text-align:center}
    .btn-dl:hover{border-color:var(--purpleB);color:var(--purpleB)}
    .btn-dl:disabled{opacity:0.3;cursor:not-allowed;border-color:var(--border);color:var(--muted)}
    .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
    .dot-free{background:#4cd4a0}.dot-used{background:#f87171}
    #statusBar{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--muted);margin-bottom:12px;display:flex;gap:16px;align-items:center}

    /* ── PRINT STYLES ── */
    @media print {
      body{background:#fff;padding:0;margin:0}
      .screen-ui{display:none}
      #printSheet{display:block!important}
      @page{size:A3 portrait;margin:0}
    }

    #printSheet{display:none}
    .print-page{
      width:297mm;min-height:420mm;padding:10mm;
      display:grid;
      grid-template-columns:repeat(6,44mm);
      grid-template-rows:repeat(7,55mm);
      gap:3mm;
      align-content:start;
      justify-content:center;
      background:#fff;
    }

    /* ── PRINT STICKER 44×55mm ── */
    .sticker-img{
      width:44mm;height:55mm;
      display:block;
      page-break-inside:avoid;
      break-inside:avoid;
      object-fit:contain;
    }
  </style>
</head>
<body>

<!-- SCREEN UI -->
<div class="screen-ui">
  <div class="logo"><img src="/konig-logo.png" alt="KONÏG Auto Detailing"/></div>
  <div class="subtitle">QR Sticker Stock Generator</div>

  <h2>Generate QR Stickers</h2>

  <div class="controls">
    <div class="ctrl-group">
      <label>Prefix</label>
      <input type="text" id="ctrlPrefix" value="KNG" maxlength="4" style="width:80px" oninput="this.value=this.value.toUpperCase()"/>
    </div>
    <div class="ctrl-group">
      <label>Mulai Dari</label>
      <input type="number" id="ctrlStart" value="1" min="1" max="9999"/>
    </div>
    <div class="ctrl-group">
      <label>Jumlah (max 200)</label>
      <input type="number" id="ctrlCount" value="90" min="1" max="200"/>
    </div>
    <button class="btn" onclick="generatePreview()">Generate</button>
    <button class="btn btn-print" onclick="downloadPDF('a4')" id="btnPDF_A4">⬇ PDF A4</button>
    <button class="btn btn-print" onclick="downloadPDF('a3',1)" id="btnPDF_A3_1">⬇ A3 Lembar 1</button>
    <button class="btn btn-print" onclick="downloadPDF('a3',2)" id="btnPDF_A3_2">⬇ A3 Lembar 2</button>
    <button class="btn btn-print" onclick="downloadPDF('a3',3)" id="btnPDF_A3_3">⬇ A3 Lembar 3</button>
    <button class="btn btn-outline" onclick="downloadAll()">⬇ Download Semua PNG</button>
  </div>

  <!-- PDF Progress Overlay -->
  <div id="pdfOverlay">
    <div class="pdf-progress-box">
      <div class="pdf-progress-title">Generating PDF...</div>
      <div class="pdf-progress-sub" id="pdfProgressSub">Menyiapkan stiker...</div>
      <div class="pdf-progress-bar-bg"><div class="pdf-progress-bar-fill" id="pdfProgressFill"></div></div>
      <div class="pdf-progress-pct" id="pdfProgressPct">0%</div>
    </div>
  </div>

  <div class="preview-label">Preview</div>
  <div id="statusBar" style="display:none">
    <span><span class="status-dot dot-free"></span>Tersedia</span>
    <span><span class="status-dot dot-used"></span>Terpakai / Terkunci</span>
    <span id="statusCount" style="color:var(--purpleB)"></span>
  </div>
  <div id="previewGrid"></div>
</div>

<!-- PRINT SHEET (hidden, shown on print) -->
<div id="printSheet">
  <div class="print-page" id="printPage"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyApef7fcfnPPjRN15L58n3D87AGnQ30_es",
  authDomain: "konig-auto-detailing.firebaseapp.com",
  projectId: "konig-auto-detailing",
  storageBucket: "konig-auto-detailing.firebasestorage.app",
  messagingSenderId: "235399414542",
  appId: "1:235399414542:web:bd9a2f3ed88f4ea36bcd5f"
});
const db = getFirestore(app);

// Load all used codes from Firestore
let usedCodes = new Set();
async function loadUsedCodes() {
  try {
    const snap = await getDocs(collection(db, 'konig_progress'));
    snap.forEach(d => usedCodes.add(d.id));
  } catch(e) { console.warn('Firebase:', e); }
}

const BASE_URL = 'https://www.konigautodetailing.com/progress';

function padNum(n, len) {
  return String(n).padStart(len, '0');
}

function makeCode(prefix, num) {
  return prefix + '-' + padNum(num, 5);
}

// Template 1122x1402. Konten stiker dalam crop: x=34..1087 (lebar 1054), y=29..1356 (tinggi 1328)
// Padding kanan crop lama = 34px kosong, bawah = 45px kosong → stiker tidak center di canvas
// Fix: crop ke konten aktual stiker, center di canvas
const TMPL_CROP = { x: 34, y: 29, w: 1054, h: 1328 };

// whiteBg: true untuk PDF (JPEG tidak support alpha), false untuk PNG download
async function renderThumb(canvas, url, S, code) {
  // Scale stretch ke canvas (template di-fit ke W×H penuh, center crop)
  const scaleX = canvas.width / TMPL_CROP.w;
  const scaleY = canvas.height / TMPL_CROP.h;
  const offX = 0, offY = 0;

  const box_x1 = (137 - TMPL_CROP.x) * scaleX;
  const box_x2 = (984 - TMPL_CROP.x) * scaleX;
  const box_y1 = (282 - TMPL_CROP.y) * scaleY;
  const box_y2 = (1081 - TMPL_CROP.y) * scaleY;
  const bw = box_x2 - box_x1, bh = box_y2 - box_y1;

  const qSize = Math.floor(Math.min(bw,bh) * 0.85);
  const margin = Math.floor(qSize * 0.04);
  const inner = qSize - margin * 2;
  const cx = Math.floor((box_x1 + box_x2) / 2);
  const gap_total = bh - qSize;
  const qr_top = box_y1 + Math.floor(gap_total * 0.40);

  const tmpl = await loadTemplate();
  const qrCanvas = await makeQRCanvas(url, inner);

  const qBg = document.createElement('canvas');
  qBg.width = qSize; qBg.height = qSize;
  const qCtx = qBg.getContext('2d');
  qCtx.fillStyle = '#ffffff';
  qCtx.fillRect(0, 0, qSize, qSize);
  qCtx.drawImage(qrCanvas, margin, margin);

  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // Corner radius: 10.42% dari lebar stiker (diukur dari PNG asli 4212px, inset 439px)
  const R = Math.round(W * 0.1042);

  // Render stiker ke canvas sementara (transparan background)
  const tmp = document.createElement('canvas');
  tmp.width = W; tmp.height = H;
  const tCtx = tmp.getContext('2d');

  // Draw template stretch ke full canvas (W×H)
  tCtx.drawImage(tmpl,
    TMPL_CROP.x, TMPL_CROP.y, TMPL_CROP.w, TMPL_CROP.h,
    0, 0, W, H
  );
  tCtx.drawImage(qBg, cx - Math.floor(qSize/2), qr_top, qSize, qSize);

  if (code) {
    const qr_bottom = qr_top + qSize;
    const gap_below = box_y2 - qr_bottom;
    const font_size = Math.floor(gap_below * 0.55);
    const text_y = qr_bottom + Math.floor(gap_below / 2);
    tCtx.font = `bold ${font_size}px sans-serif`;
    tCtx.fillStyle = '#3c0064';
    tCtx.textAlign = 'center';
    tCtx.textBaseline = 'middle';
    tCtx.fillText(code, cx, text_y);
  }

  // Selalu transparan di luar rounded rect — background putih ada di cell canvas (PDF)
  // atau di halaman (preview). Ini penting agar bleed zone bisa ambil warna tepi stiker.
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(0, 0, W, H, R);
  ctx.clip();
  ctx.drawImage(tmp, 0, 0);
  ctx.restore();
}

async function generatePreview() {
  const prefix = document.getElementById('ctrlPrefix').value.trim().toUpperCase() || 'KNG';
  const start = parseInt(document.getElementById('ctrlStart').value) || 1;
  const count = Math.min(parseInt(document.getElementById('ctrlCount').value) || 20, 100);

  await loadUsedCodes();

  const grid = document.getElementById('previewGrid');
  grid.innerHTML = '';

  let freeCount = 0, usedCount = 0;

  for (let i = 0; i < count; i++) {
    const code = makeCode(prefix, start + i);
    const url = BASE_URL + '?code=' + code;
    const isUsed = usedCodes.has(code);
    if (isUsed) usedCount++; else freeCount++;

    const card = document.createElement('div');
    card.className = 'sticker-preview' + (isUsed ? ' used' : '');
    card.id = 'card_' + code;

    // Canvas thumbnail — same logic as download but at preview scale
    const thumbCanvas = document.createElement('canvas');
    const PS = 1;  // preview scale, CSS scales to 160px
    thumbCanvas.width = 1054 * PS;   // crop width
    thumbCanvas.height = 1328 * PS;  // crop height
    card.appendChild(thumbCanvas);

    const wrap = document.createElement('div');
    wrap.className = 'sticker-wrap';
    wrap.appendChild(card);
    const dlBtn = document.createElement('button');
    dlBtn.className = 'btn-dl';
    dlBtn.dataset.code = code;
    if (isUsed) {
      dlBtn.textContent = '🔒 Terkunci';
      dlBtn.disabled = true;
    } else {
      dlBtn.textContent = '⬇ Download PNG';
      dlBtn.addEventListener('click', () => downloadSticker(code));
    }
    wrap.appendChild(dlBtn);
    grid.appendChild(wrap);

    // Render thumbnail async
    renderThumb(thumbCanvas, url, PS, code);
  }

  // Show status bar
  const bar = document.getElementById('statusBar');
  bar.style.display = 'flex';
  document.getElementById('statusCount').textContent = `${freeCount} tersedia · ${usedCount} terkunci`;

  buildPrintSheet(prefix, start, count);
}

async function buildPrintSheet(prefix, start, count) {
  const page = document.getElementById('printPage');
  page.innerHTML = '';
  const printCount = Math.min(count, 36);
  // Render semua ke canvas dulu
  const jobs = [];
  const canvases = [];
  for (let i = 0; i < printCount; i++) {
    const code = makeCode(prefix, start + i);
    const url = BASE_URL + '?code=' + code;
    const c = document.createElement('canvas');
    c.width = 472; c.height = Math.round(472 / 1054 * 1328);  // maintain aspect ratio
    canvases.push(c);
    jobs.push(renderThumb(c, url, 472/1054, code));
  }
  await Promise.all(jobs);
  // Konversi canvas → <img> base64 (biar bisa di-print di semua browser/Safari)
  for (const c of canvases) {
    const img = document.createElement('img');
    img.src = c.toDataURL('image/png');
    img.className = 'sticker-img';
    page.appendChild(img);
  }
}

async function downloadPDF(format = 'a3', sheetNum = null) {
  const isA4 = format === 'a4';
  const btnId = isA4 ? 'btnPDF_A4' : (sheetNum ? `btnPDF_A3_${sheetNum}` : 'btnPDF_A3_1');
  const btn = document.getElementById(btnId);
  const origText = btn.textContent;
  btn.disabled = true;

  const overlay = document.getElementById('pdfOverlay');
  const progressFill = document.getElementById('pdfProgressFill');
  const progressPct = document.getElementById('pdfProgressPct');
  const progressSub = document.getElementById('pdfProgressSub');
  function setProgress(pct, sub) {
    progressFill.style.width = pct + '%';
    progressPct.textContent = Math.round(pct) + '%';
    if (sub) progressSub.textContent = sub;
  }
  overlay.classList.add('active');
  setProgress(0, 'Menyiapkan...');

  const prefix = document.getElementById('ctrlPrefix').value.trim().toUpperCase() || 'KNG';
  const startAll = parseInt(document.getElementById('ctrlStart').value) || 1;
  const totalCount = Math.min(parseInt(document.getElementById('ctrlCount').value) || 90, 500);

  // ── LAYOUT CONSTANTS ──────────────────────────────────────────────
  // Stiker 44×55mm. Bleed 2mm per sisi.
  // Jarak antar cutting line = 4mm (= 2mm bleed kanan stiker kiri + 2mm bleed kiri stiker kanan)
  // → bleed mengisi seluruh ruang antar stiker, tidak ada gap putih antar bleed
  const STICKER_W_MM = 50;
  const STICKER_H_MM = 60;
  const BLEED_MM = 2;        // bleed per sisi
  const MARGIN_MM = 8;       // margin tepi halaman
  const PAGE_W = isA4 ? 210 : 297;
  const PAGE_H = isA4 ? 297 : 420;

  // Step cutting-to-cutting = stiker + 2×bleed (bleed dua stiker bersebelahan saling bertemu)
  const STEP_W = STICKER_W_MM + BLEED_MM * 2;  // 44 + 4 = 48mm
  const STEP_H = STICKER_H_MM + BLEED_MM * 2;  // 55 + 4 = 59mm

  // Area efektif = halaman - 2×margin - 2×bleed (bleed terluar masuk ke margin)
  const AREA_W = PAGE_W - MARGIN_MM * 2 - BLEED_MM * 2;
  const AREA_H = PAGE_H - MARGIN_MM * 2 - BLEED_MM * 2;
  const COLS = Math.floor(AREA_W / STEP_W);  // A4: floor((210-20-4)/48) = floor(186/48) = 3
  const ROWS = Math.floor(AREA_H / STEP_H);  // A4: floor((297-20-4)/59) = floor(273/59) = 4
  const PER_PAGE = COLS * ROWS;

  // ── RENDER RESOLUTION: 300dpi ─────────────────────────────────────
  const PX_PER_MM = 300 / 25.4;  // ≈ 11.81px/mm
  // Gunakan nilai exact (tanpa Math.round) agar ukuran PDF persis 50×60mm
  // Canvas harus integer untuk pixel, tapi PDF size dihitung dari SW_EXACT/PX_PER_MM
  const SW_EXACT = STICKER_W_MM * PX_PER_MM;  // exact float
  const SH_EXACT = STICKER_H_MM * PX_PER_MM;
  const SW = Math.round(SW_EXACT);  // pixel canvas (harus integer)
  const SH = Math.round(SH_EXACT);
  const BLEED_PX = Math.round(BLEED_MM * PX_PER_MM); // 2mm bleed in px
  const CW = SW + BLEED_PX * 2;  // canvas width inkl bleed kiri+kanan
  const CH = SH + BLEED_PX * 2;  // canvas height inkl bleed atas+bawah
  // Scale untuk renderThumb: canvas stiker SW×SH, template crop 1054px lebar
  const RENDER_SCALE = SW / 1054;

  // ── 1 lembar saja ────────────────────────────────────────────────
  const totalPages = 1;

  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: isA4 ? 'a4' : 'a3' });

    for (let page = 0; page < totalPages; page++) {
      if (page > 0) pdf.addPage();

      const pageStart = page * PER_PAGE;
      const pageCount = Math.min(PER_PAGE, totalCount - pageStart);
      if (pageCount <= 0) break;

      // Stiker nomor berapa di halaman ini
      const pageStartCode = startAll + pageStart;

      btn.textContent = `⏳ Halaman ${page+1}/${totalPages}...`;
      setProgress((page / totalPages) * 90, `Render halaman ${page+1} dari ${totalPages}...`);

      // ── Render semua stiker halaman ini parallel ──
      const stickerCanvases = [];
      const jobs = [];
      for (let i = 0; i < pageCount; i++) {
        const code = makeCode(prefix, pageStartCode + i);
        const url = BASE_URL + '?code=' + code;
        // sc = canvas stiker saja (SW×SH), tanpa bleed
        const sc = document.createElement('canvas');
        sc.width = SW; sc.height = SH;
        stickerCanvases.push({ sc, code });
        jobs.push(renderThumb(sc, url, RENDER_SCALE, code, false));
      }
      await Promise.all(jobs);

      // ── Composite: stiker + bleed ke canvas cell (CW×CH) ──
      // Corner radius dari stiker (10.42% lebar) — bleed radius = R + BLEED_PX
      const R_stiker = Math.round(SW * 0.1042);
      const R_bleed = R_stiker + BLEED_PX;
      const cellCanvases = stickerCanvases.map(({ sc, code }) => {
        const cell = document.createElement('canvas');
        cell.width = CW; cell.height = CH;
        const ctx = cell.getContext('2d');

        // 1. Background putih (kertas)
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, CW, CH);

        // 2. Bleed = rounded rect hitam solid (warna tepi stiker) ukuran CW×CH (= stiker + 2mm semua sisi)
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.roundRect(0, 0, CW, CH, R_bleed);
        ctx.fill();

        // 3. Stiker asli di tengah cell (offset BLEED_PX), clip ke R_sticker
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(BLEED_PX, BLEED_PX, SW, SH, R_stiker);
        ctx.clip();
        ctx.drawImage(sc, BLEED_PX, BLEED_PX);
        ctx.restore();

        return { cell, code };
      });

      // ── Center grid di halaman ──
      // Grid total (cutting to cutting) = COLS*STEP_W - BLEED_MM*2 (bleed terluar tidak dihitung)
      // Tapi lebih mudah: total cell canvas = COLS*STEP_W (cell = stiker+bleed kiri+kanan)
      // Posisi cell pertama (inkl bleed kiri) = offsetX - BLEED_MM
      // → offsetX = cutting-line stiker pertama
      // Total lebar semua cell inkl bleed terluar = COLS*STEP_W + 2*BLEED_MM
      // (setiap cell = stiker+bleed kiri+kanan, tapi bleed terluar hanya 1×)
      const totalCellW = COLS * STEP_W + BLEED_MM * 2;
      const totalCellH = ROWS * STEP_H + BLEED_MM * 2;
      // offsetX = posisi kiri cell[0] inkl bleed kiri (= sx_col0 - BLEED_MM)
      const cellOriginX = (PAGE_W - totalCellW) / 2;
      const cellOriginY = (PAGE_H - totalCellH) / 2;
      // cutting-line col=0 = cellOriginX + BLEED_MM
      const offsetX = cellOriginX + BLEED_MM;
      const offsetY = cellOriginY + BLEED_MM;

      // ── Tempatkan stiker di PDF ──
      // CELL_W/H_MM: ukuran image di PDF = stiker + bleed dua sisi
      // Pakai STICKER_W/H_MM langsung (exact) agar stiker persis 50×60mm
      const CELL_W_MM = STICKER_W_MM + BLEED_MM * 2;  // 54mm exact
      const CELL_H_MM = STICKER_H_MM + BLEED_MM * 2;  // 64mm exact
      // addImage scale: image CW×CH pixel → CELL_W×H_MM
      // → stiker area SW/CW × CELL_W_MM = persis STICKER_W_MM karena:
      //   SW/CW = SW/(SW+2*BLEED_PX), CELL_W_MM = STICKER_W_MM + 2*BLEED_MM
      //   = STICKER_W_MM * (1 + 2*BLEED_MM/STICKER_W_MM) ≠ exact karena rounding BLEED_PX
      // FIX: gunakan alias agar stiker PERSIS 50×60mm — tempatkan image dengan ukuran
      //   cell_w = STICKER_W_MM * CW/SW, cell_h = STICKER_H_MM * CH/SH
      const TRUE_CELL_W_MM = STICKER_W_MM * CW / SW;  // exact mapping pixel→mm
      const TRUE_CELL_H_MM = STICKER_H_MM * CH / SH;
      for (let i = 0; i < pageCount; i++) {
        const col = i % COLS;
        const row = Math.floor(i / COLS);
        // Posisi cutting-line kiri-atas stiker ini
        const sx = offsetX + col * STEP_W;
        const sy = offsetY + row * STEP_H;

        // addImage: pakai TRUE_CELL ukuran agar stiker = persis STICKER_W_MM × STICKER_H_MM
        // TRUE_CELL = STICKER_W_MM * CW/SW → stiker area SW/CW * TRUE_CELL = STICKER_W_MM
        const bleed_w_mm = TRUE_CELL_W_MM - STICKER_W_MM;  // total bleed kiri+kanan dalam mm
        const bleed_h_mm = TRUE_CELL_H_MM - STICKER_H_MM;
        const imgData = cellCanvases[i].cell.toDataURL('image/png');
        pdf.addImage(imgData, 'PNG', sx - bleed_w_mm/2, sy - bleed_h_mm/2, TRUE_CELL_W_MM, TRUE_CELL_H_MM);

        // ── Cutting line: outline rounded mengikuti outline stiker ──
        // R dalam mm = R_stiker px / PX_PER_MM
        const R_mm = R_stiker / PX_PER_MM;
        const W_mm = STICKER_W_MM, H_mm = STICKER_H_MM;
        pdf.setDrawColor(0, 0, 0);
        pdf.setLineWidth(0.15);
        // Gambar rounded rect sebagai path: 4 sisi lurus + 4 arc sudut
        // jsPDF lines[]: array [x1,y1,x2,y2] — pakai lines() untuk polyline
        // Gunakan arc approximasi dengan banyak titik kecil di setiap sudut
        const steps = 12; // titik per sudut
        const pts = [];
        const corners = [
          { cx: sx + R_mm,       cy: sy + R_mm,       a0: Math.PI,       a1: Math.PI * 1.5 },  // kiri-atas
          { cx: sx + W_mm - R_mm, cy: sy + R_mm,      a0: Math.PI * 1.5, a1: Math.PI * 2   },  // kanan-atas
          { cx: sx + W_mm - R_mm, cy: sy + H_mm - R_mm, a0: 0,           a1: Math.PI * 0.5 },  // kanan-bawah
          { cx: sx + R_mm,       cy: sy + H_mm - R_mm, a0: Math.PI * 0.5, a1: Math.PI      },  // kiri-bawah
        ];
        for (const { cx, cy, a0, a1 } of corners) {
          for (let s = 0; s <= steps; s++) {
            const a = a0 + (a1 - a0) * s / steps;
            pts.push({ x: cx + R_mm * Math.cos(a), y: cy + R_mm * Math.sin(a) });
          }
        }
        // Tutup path
        pts.push(pts[0]);
        for (let p = 0; p < pts.length - 1; p++) {
          pdf.line(pts[p].x, pts[p].y, pts[p+1].x, pts[p+1].y);
        }
      }
    }

    setProgress(95, 'Menyimpan PDF...');
    const startCode = makeCode(prefix, startAll);
    const endCode = makeCode(prefix, startAll + totalCount - 1);
    const sheetLabel = sheetNum ? `-L${sheetNum}` : '';
    pdf.save(`KONIG-QR-${startCode}-${endCode}${sheetLabel}.pdf`);
    setProgress(100, 'Selesai! ✓');
    setTimeout(() => overlay.classList.remove('active'), 1200);
  } catch(e) {
    overlay.classList.remove('active');
    alert('Error: ' + e.message);
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.textContent = origText;
    overlay.classList.remove('active');
  }
}

// Load template image once (from inline base64 — no CORS)
let _templateImg = null;
function loadTemplate() {
  if (_templateImg) return Promise.resolve(_templateImg);
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { _templateImg = img; res(img); };
    img.onerror = rej;
    img.src = typeof QR_TEMPLATE_B64 !== 'undefined' ? QR_TEMPLATE_B64 : '/qr-sticker-template.png';
  });
}

// Generate QR canvas — render at exact integer pixels per module then scale to target size
function makeQRCanvas(url, size) {
  const qr = qrcode(0, 'H');
  qr.addData(url);
  qr.make();
  const moduleCount = qr.getModuleCount();

  // Render at minimum 8px per module for crisp QR, then scale down to target
  const cellPx = Math.max(8, Math.ceil(size / moduleCount));
  const rawSize = cellPx * moduleCount;

  // Draw at native integer size
  const raw = document.createElement('canvas');
  raw.width = rawSize; raw.height = rawSize;
  const rCtx = raw.getContext('2d');
  rCtx.fillStyle = '#ffffff';
  rCtx.fillRect(0, 0, rawSize, rawSize);
  rCtx.fillStyle = '#4B0082';
  for (let r = 0; r < moduleCount; r++) {
    for (let col = 0; col < moduleCount; col++) {
      if (qr.isDark(r, col)) {
        rCtx.fillRect(col * cellPx, r * cellPx, cellPx, cellPx);
      }
    }
  }

  // If raw is already target size, return as-is
  if (rawSize === size) return Promise.resolve(raw);

  // Scale down to target size with crisp rendering
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;  // keep QR pixels crisp
  ctx.drawImage(raw, 0, 0, size, size);
  return Promise.resolve(c);
}

async function downloadSticker(code) {
  // Find button by data-code attribute
  const btn = document.querySelector(`.btn-dl[data-code="${code}"]`);
  if (btn) { btn.textContent = '⏳ Generating...'; btn.disabled = true; }

  const url = BASE_URL + '?code=' + code;
  // 4K output berdasarkan crop size (1054x1328 base)
  const SCALE = 4;
  const canvas = document.createElement('canvas');
  canvas.width = 1054 * SCALE;
  canvas.height = 1328 * SCALE;

  try {
    await renderThumb(canvas, url, SCALE, code);

    // Download
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.download = 'KONIG-QR-' + code + '.png';
      a.href = URL.createObjectURL(blob);
      a.click();
      if (btn) { btn.textContent = '⬇ Download PNG'; btn.disabled = false; }
    }, 'image/png');
  } catch(e) {
    alert('Error: ' + e.message);
    if (btn) { btn.textContent = '⬇ Download PNG'; btn.disabled = false; }
  }
}

async function downloadAll() {
  const btns = document.querySelectorAll('.btn-dl:not(:disabled)');
  for (const btn of btns) {
    const code = btn.closest('div').querySelector('.sticker-preview')?.id?.replace('card_','');
    if (code) { await downloadSticker(code); await new Promise(r => setTimeout(r, 500)); }
  }
}
