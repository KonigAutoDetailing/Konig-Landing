<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>KONÏG — Print QR Sticker Stock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/qr-template-b64.js"></script>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --black:#080810;--dark:#0f0f1a;--panel:#161625;--border:#2a2a45;
      --purple:#7B2FBE;--purpleB:#b06aff;--white:#f0eeff;--text:#d4cef0;--muted:#9d93c0;
    }
    body{background:var(--black);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;padding:24px}

    /* ── SCREEN UI ── */
    .screen-ui{max-width:600px;margin:0 auto}
    .logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:4px;color:var(--white);margin-bottom:4px}
    .logo span{color:var(--purpleB)}
    .subtitle{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:32px}
    h2{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--white);margin-bottom:20px}

    .controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:28px;align-items:flex-end}
    .ctrl-group{display:flex;flex-direction:column;gap:6px}
    .ctrl-group label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
    .ctrl-group input{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--white);font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;padding:10px 14px;width:120px;outline:none}
    .ctrl-group input:focus{border-color:var(--purple)}
    .btn{background:var(--purple);color:#fff;border:none;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:12px 24px;cursor:pointer;transition:background 0.2s}
    .btn:hover{background:var(--purpleB)}
    .btn-outline{background:transparent;border:1px solid var(--purple);color:var(--purpleB)}
    .btn-outline:hover{background:rgba(123,47,190,0.15)}
    .btn-print{background:#1a3a1a;border:1px solid #4cd4a0;color:#4cd4a0}
    .btn-print:hover{background:#1f4a1f}

    .preview-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
    #previewGrid{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px}

    /* ── STICKER CARD (screen preview) ── */
    .sticker-preview{
      background:#0f0f1a;border:1px solid var(--border);
      width:140px;padding:10px;text-align:center;
    }
    .sticker-preview .s-brand{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:2px;color:var(--purpleB);margin-bottom:4px}
    .sticker-preview .s-code{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:3px;color:var(--white);margin:4px 0}
    .sticker-preview .s-qr{display:flex;justify-content:center;margin:4px 0}
    .sticker-preview .s-qr img,.sticker-preview .s-qr canvas{display:block}
    .sticker-preview .s-url{font-size:7px;color:var(--muted);word-break:break-all;margin-top:4px;line-height:1.3}
    .btn-dl{display:block;width:100%;margin-top:6px;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:4px;cursor:pointer;text-align:center}
    .btn-dl:hover{border-color:var(--purpleB);color:var(--purpleB)}
    .btn-dl:disabled{opacity:0.3;cursor:not-allowed;border-color:var(--border);color:var(--muted)}
    .sticker-preview.used{opacity:0.45;position:relative}
    .sticker-preview.used::after{content:'🔒 TERPAKAI';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(248,113,113,0.9);color:#fff;font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:2px;padding:4px 8px;white-space:nowrap}
    .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
    .dot-free{background:#4cd4a0}.dot-used{background:#f87171}
    #statusBar{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--muted);margin-bottom:12px;display:flex;gap:16px;align-items:center}

    /* ── PRINT STYLES ── */
    @media print {
      body{background:#fff;padding:0;margin:0}
      .screen-ui{display:none}
      #printSheet{display:block!important}
    }

    #printSheet{display:none}
    .print-page{
      width:210mm;min-height:297mm;padding:10mm;
      display:flex;flex-wrap:wrap;gap:4mm;align-content:flex-start;
      background:#fff;
    }

    /* ── PRINT STICKER ── */
    .sticker-print{
      width:44mm;height:44mm;
      border:0.5mm solid #ccc;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:2mm;text-align:center;background:#fff;
      page-break-inside:avoid;
    }
    .sticker-print .p-brand{font-family:'Bebas Neue',sans-serif;font-size:7pt;letter-spacing:1.5pt;color:#7B2FBE;margin-bottom:1mm}
    .sticker-print .p-code{font-family:'Bebas Neue',sans-serif;font-size:11pt;letter-spacing:2pt;color:#111;margin:1mm 0}
    .sticker-print .p-qr{display:flex;justify-content:center;margin:1mm 0}
    .sticker-print .p-qr img,.sticker-print .p-qr canvas{display:block}
    .sticker-print .p-url{font-size:5pt;color:#666;word-break:break-all;margin-top:1mm;line-height:1.3;font-family:sans-serif}
  </style>
</head>
<body>

<!-- SCREEN UI -->
<div class="screen-ui">
  <div class="logo">KONÏG <span>Auto Detailing</span></div>
  <div class="subtitle">QR Sticker Stock Generator</div>

  <h2>Generate QR Stickers</h2>

  <div class="controls">
    <div class="ctrl-group">
      <label>Prefix</label>
      <input type="text" id="ctrlPrefix" value="K" maxlength="4" style="width:80px" oninput="this.value=this.value.toUpperCase()"/>
    </div>
    <div class="ctrl-group">
      <label>Mulai Dari</label>
      <input type="number" id="ctrlStart" value="1" min="1" max="9999"/>
    </div>
    <div class="ctrl-group">
      <label>Jumlah</label>
      <input type="number" id="ctrlCount" value="20" min="1" max="100"/>
    </div>
    <button class="btn" onclick="generatePreview()">Generate</button>
    <button class="btn btn-print" onclick="doPrint()">🖨️ Print</button>
    <button class="btn btn-outline" onclick="downloadAll()">⬇ Download Semua</button>
  </div>

  <div class="preview-label">Preview</div>
  <div id="statusBar" style="display:none">
    <span><span class="status-dot dot-free"></span>Tersedia</span>
    <span><span class="status-dot dot-used"></span>Terpakai / Terkunci</span>
    <span id="statusCount" style="color:var(--purpleB)"></span>
  </div>
  <div id="previewGrid"></div>
</div>

<!-- PRINT SHEET (hidden, shown on print) -->
<div id="printSheet">
  <div class="print-page" id="printPage"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyApef7fcfnPPjRN15L58n3D87AGnQ30_es",
  authDomain: "konig-auto-detailing.firebaseapp.com",
  projectId: "konig-auto-detailing",
  storageBucket: "konig-auto-detailing.firebasestorage.app",
  messagingSenderId: "235399414542",
  appId: "1:235399414542:web:bd9a2f3ed88f4ea36bcd5f"
});
const db = getFirestore(app);

// Load all used codes from Firestore
let usedCodes = new Set();
async function loadUsedCodes() {
  try {
    const snap = await getDocs(collection(db, 'konig_progress'));
    snap.forEach(d => usedCodes.add(d.id));
  } catch(e) { console.warn('Firebase:', e); }
}

const BASE_URL = 'https://www.konigautodetailing.com/progress';

function padNum(n, len) {
  return String(n).padStart(len, '0');
}

function makeCode(prefix, num) {
  const digits = num >= 1000 ? 4 : num >= 100 ? 3 : 3;
  return prefix + padNum(num, digits);
}

async function generatePreview() {
  const prefix = document.getElementById('ctrlPrefix').value.trim().toUpperCase() || 'K';
  const start = parseInt(document.getElementById('ctrlStart').value) || 1;
  const count = Math.min(parseInt(document.getElementById('ctrlCount').value) || 20, 100);

  await loadUsedCodes();

  const grid = document.getElementById('previewGrid');
  grid.innerHTML = '';

  let freeCount = 0, usedCount = 0;

  for (let i = 0; i < count; i++) {
    const code = makeCode(prefix, start + i);
    const url = BASE_URL + '?code=' + code;
    const isUsed = usedCodes.has(code);
    if (isUsed) usedCount++; else freeCount++;

    const card = document.createElement('div');
    card.className = 'sticker-preview' + (isUsed ? ' used' : '');
    card.id = 'card_' + code;
    card.innerHTML = `
      <div class="s-brand">KONÏG</div>
      <div class="s-code">${code}</div>
      <div class="s-qr" id="prev_${code}"></div>
      <div class="s-url">${url}</div>
    `;
    const wrap = document.createElement('div');
    wrap.style.cssText = 'width:140px';
    wrap.appendChild(card);
    const dlBtn = document.createElement('button');
    dlBtn.className = 'btn-dl';
    dlBtn.dataset.code = code;
    if (isUsed) {
      dlBtn.textContent = '🔒 Terkunci';
      dlBtn.disabled = true;
    } else {
      dlBtn.textContent = '⬇ Download 4K';
      dlBtn.addEventListener('click', () => downloadSticker(code));
    }
    wrap.appendChild(dlBtn);
    grid.appendChild(wrap);

    setTimeout(() => {
      const el = document.getElementById('prev_' + code);
      if (!el) return;
      new QRCode(el, { text: url, width: 80, height: 80, colorDark: isUsed ? '#555' : '#7B2FBE', colorLight: '#0f0f1a', correctLevel: QRCode.CorrectLevel.H });
    }, 0);
  }

  // Show status bar
  const bar = document.getElementById('statusBar');
  bar.style.display = 'flex';
  document.getElementById('statusCount').textContent = `${freeCount} tersedia · ${usedCount} terkunci`;

  buildPrintSheet(prefix, start, count);
}

function buildPrintSheet(prefix, start, count) {
  const page = document.getElementById('printPage');
  page.innerHTML = '';

  for (let i = 0; i < count; i++) {
    const code = makeCode(prefix, start + i);
    const url = BASE_URL + '?code=' + code;

    const sticker = document.createElement('div');
    sticker.className = 'sticker-print';
    sticker.innerHTML = `
      <div class="p-brand">KONÏG Auto Detailing</div>
      <div class="p-code">${code}</div>
      <div class="p-qr" id="print_${code}"></div>
      <div class="p-url">konigautodetailing.com/progress</div>
    `;
    page.appendChild(sticker);

    setTimeout(() => {
      const el = document.getElementById('print_' + code);
      if (!el) return;
      new QRCode(el, { text: url, width: 100, height: 100, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
    }, 0);
  }
}

function doPrint() {
  const prefix = document.getElementById('ctrlPrefix').value.trim().toUpperCase() || 'K';
  const start = parseInt(document.getElementById('ctrlStart').value) || 1;
  const count = Math.min(parseInt(document.getElementById('ctrlCount').value) || 20, 100);
  buildPrintSheet(prefix, start, count);
  setTimeout(() => window.print(), 600);
}

// Load template image once (from inline base64 — no CORS)
let _templateImg = null;
function loadTemplate() {
  if (_templateImg) return Promise.resolve(_templateImg);
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { _templateImg = img; res(img); };
    img.onerror = rej;
    img.src = typeof QR_TEMPLATE_B64 !== 'undefined' ? QR_TEMPLATE_B64 : '/qr-sticker-template.png';
  });
}

// Generate QR as canvas (pure canvas, no DOM)
function makeQRCanvas(url, size) {
  return new Promise(res => {
    const tmp = document.createElement('div');
    tmp.style.cssText = 'position:fixed;left:-9999px;top:-9999px';
    document.body.appendChild(tmp);
    new QRCode(tmp, { text: url, width: size, height: size, colorDark: '#4B0082', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
    setTimeout(() => {
      // QRCode lib creates both a canvas AND an img — use canvas directly
      const src = tmp.querySelector('canvas') || tmp.querySelector('img');
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      if (src.tagName === 'CANVAS') {
        ctx.drawImage(src, 0, 0, size, size);
        document.body.removeChild(tmp);
        res(c);
      } else {
        // fallback: img — wait for it to load
        if (src.complete) {
          ctx.drawImage(src, 0, 0, size, size);
          document.body.removeChild(tmp);
          res(c);
        } else {
          src.onload = () => {
            ctx.drawImage(src, 0, 0, size, size);
            document.body.removeChild(tmp);
            res(c);
          };
        }
      }
    }, 200);
  });
}

async function downloadSticker(code) {
  // Find button by data-code attribute
  const btn = document.querySelector(`.btn-dl[data-code="${code}"]`);
  if (btn) { btn.textContent = '⏳ Generating...'; btn.disabled = true; }

  const url = BASE_URL + '?code=' + code;
  const SCALE = 3;
  const TW = 1122 * SCALE, TH = 1402 * SCALE;

  // White box in original template: x=162-959, y=260-1229
  const box_x1 = 162 * SCALE, box_x2 = 959 * SCALE;
  const box_y1 = 260 * SCALE, box_y2 = 1229 * SCALE;
  const box_w = box_x2 - box_x1;  // 2391
  const box_h = box_y2 - box_y1;  // 2907

  // QR = 60% of shorter dimension, centered in white box
  const qSize = Math.floor(Math.min(box_w, box_h) * 0.60);  // 1434
  const margin = Math.floor(qSize * 0.05);
  const inner = qSize - margin * 2;

  try {
    const [tmpl, qrCanvas] = await Promise.all([loadTemplate(), makeQRCanvas(url, inner)]);

    // Composite: white bg square + QR in center
    const qBg = document.createElement('canvas');
    qBg.width = qSize; qBg.height = qSize;
    const qCtx = qBg.getContext('2d');
    qCtx.fillStyle = '#ffffff';
    qCtx.fillRect(0, 0, qSize, qSize);
    qCtx.drawImage(qrCanvas, margin, margin, inner, inner);

    const canvas = document.createElement('canvas');
    canvas.width = TW; canvas.height = TH;
    const ctx = canvas.getContext('2d');

    // Draw template upscaled
    ctx.drawImage(tmpl, 0, 0, TW, TH);

    // Center QR in white area
    const cx = (box_x1 + box_x2) / 2;
    const cy = (box_y1 + box_y2) / 2;
    ctx.drawImage(qBg, cx - qSize/2, cy - qSize/2, qSize, qSize);

    // Download
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.download = 'KONIG-QR-' + code + '.jpg';
      a.href = URL.createObjectURL(blob);
      a.click();
      if (btn) { btn.textContent = '⬇ Download JPEG'; btn.disabled = false; }
    }, 'image/jpeg', 0.95);
  } catch(e) {
    alert('Error: ' + e.message);
    if (btn) { btn.textContent = '⬇ Download JPEG'; btn.disabled = false; }
  }
}

async function downloadAll() {
  const btns = document.querySelectorAll('.btn-dl:not(:disabled)');
  for (const btn of btns) {
    const code = btn.closest('div').querySelector('.sticker-preview')?.id?.replace('card_','');
    if (code) { await downloadSticker(code); await new Promise(r => setTimeout(r, 500)); }
  }
}

// expose untuk onclick di HTML
window.generatePreview = generatePreview;
window.doPrint = doPrint;
window.downloadAll = downloadAll;

// Auto generate on load
generatePreview();
</script>
</body>
</html>
